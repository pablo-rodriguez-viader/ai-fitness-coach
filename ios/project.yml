name: AIFitnessCoach
options:
  bundleIdPrefix: com.example
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
# Debug: local development. Beta: TestFlight private beta (release build, beta backend).
# Release: App Store. Values per configuration live in Config/*.xcconfig.
configs:
  Debug: debug
  Beta: release
  Personal: release
  Release: release
targets:
  AIFitnessCoach:
    type: application
    platform: iOS
    sources:
      - path: AIFitnessCoach
    # Not `info:`: XcodeGen would regenerate the plist and drop our keys (APIBaseURL, Health usage).
    entitlements:
      path: AIFitnessCoach/Resources/AIFitnessCoach.entitlements
    configFiles:
      Debug: Config/Debug.xcconfig
      Beta: Config/Beta.xcconfig
      Personal: Config/Personal.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: AIFitnessCoach/Resources/Info.plist
        # Icon from Gemini (Resources/Assets.xcassets/AppIcon.appiconset, one 1024 px image).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: AI Fitness Coach
        # PRODUCT_NAME has spaces; tests import the module as AIFitnessCoach.
        PRODUCT_MODULE_NAME: AIFitnessCoach
        # MARKETING_VERSION, CURRENT_PROJECT_VERSION, API_BASE_URL and APP_ENVIRONMENT come from
        # Config/*.xcconfig. Bump CURRENT_PROJECT_VERSION for every upload (testflight.sh does it).
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Xcode extracts every SwiftUI literal into Resources/Localizable.xcstrings on build,
        # ready for translation (development language: Spanish).
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        DEVELOPMENT_LANGUAGE: es
      configs:
        Beta:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        Personal:
          # Free Apple ID: only the HealthKit entitlement (see Config/Personal.xcconfig).
          CODE_SIGN_ENTITLEMENTS: AIFitnessCoach/Resources/AIFitnessCoach.Personal.entitlements
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    capabilities:
      HealthKit:
        enabled: true
      SignInWithApple:
        enabled: true
  AIFitnessCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AIFitnessCoachTests
    dependencies:
      - target: AIFitnessCoach
    configFiles:
      Debug: Config/Debug.xcconfig
      Beta: Config/Beta.xcconfig
      Personal: Config/Personal.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        # The app product is "AI Fitness Coach.app" (PRODUCT_NAME has spaces); XcodeGen's default
        # test host uses the target name, which does not exist.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AI Fitness Coach.app/AI Fitness Coach"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  AIFitnessCoach:
    build:
      targets:
        AIFitnessCoach: all
        AIFitnessCoachTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AIFitnessCoachTests
    archive:
      config: Release
  AIFitnessCoach Beta:
    build:
      targets:
        AIFitnessCoach: all
    run:
      config: Beta
    profile:
      config: Beta
    archive:
      config: Beta
  AIFitnessCoach Personal:
    build:
      targets:
        AIFitnessCoach: all
    run:
      config: Personal
    archive:
      config: Personal
