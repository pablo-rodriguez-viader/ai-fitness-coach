name: iOS Personal (Sideloadly)

# Builds the Personal configuration (free Apple ID: access-code login, no Sign in with Apple)
# and publishes an .ipa to install with Sideloadly or AltStore. No Apple account or secrets
# needed here: Sideloadly signs the app with your free Apple ID on your PC.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "HTTPS URL of your backend (e.g. https://tu-nombre.ngrok-free.app)"
        required: true
      bundle_id:
        description: "Unique bundle id (e.g. com.tunombre.aicoach). Do not use com.example."
        required: true
      run_tests:
        description: "Run the iOS unit tests first"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check inputs
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          APP_BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          [[ "$API_BASE_URL" == https://* ]] || { echo "::error::api_base_url must start with https://"; exit 1; }
          [[ "$APP_BUNDLE_ID" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]] || { echo "::error::bundle_id is not a valid bundle id"; exit 1; }
          [[ "$APP_BUNDLE_ID" != com.example.* ]] || { echo "::error::bundle_id still uses com.example"; exit 1; }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run iOS unit tests
        if: ${{ inputs.run_tests }}
        working-directory: ios
        run: |
          bash scripts/ci-run.sh test xcodebuild test -project AIFitnessCoach.xcodeproj -scheme AIFitnessCoach \
            -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO
          grep -E "Executed [0-9]+ tests" build/ci-logs/test.log | tail -1

      - name: Build for iPhone (unsigned)
        working-directory: ios
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          APP_BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          bash scripts/ci-run.sh build-personal xcodebuild build \
            -project AIFitnessCoach.xcodeproj \
            -scheme "AIFitnessCoach Personal" \
            -configuration Personal \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            APP_BUNDLE_ID="$APP_BUNDLE_ID" \
            API_BASE_URL="$API_BASE_URL" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Package .ipa
        working-directory: ios
        run: |
          APP="$(find build/dd/Build/Products/Personal-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          [[ -d "$APP" ]] || { echo "::error::App bundle not found"; exit 1; }
          # The app refuses to start without these keys ("Backend no configurado").
          BUILT_URL="$(/usr/libexec/PlistBuddy -c 'Print :APIBaseURL' "$APP/Info.plist" 2>/dev/null || true)"
          [[ "$BUILT_URL" == "${{ inputs.api_base_url }}" ]] || { echo "::error::Info.plist APIBaseURL is '$BUILT_URL', expected '${{ inputs.api_base_url }}'"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :NSHealthShareUsageDescription' "$APP/Info.plist" >/dev/null \
            || { echo "::error::Info.plist is missing NSHealthShareUsageDescription"; exit 1; }
          # Ad-hoc signature carrying the HealthKit entitlement; Sideloadly re-signs it with your Apple ID.
          codesign --force --sign - \
            --entitlements AIFitnessCoach/Resources/AIFitnessCoach.Personal.entitlements "$APP"
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry "AIFitnessCoach-Personal-${{ github.run_number }}.ipa" Payload)
          ls -la build/*.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: AIFitnessCoach-Personal-${{ github.run_number }}
          path: ios/build/*.ipa
          retention-days: 30

      - name: Keep logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-personal-logs-${{ github.run_number }}
          path: ios/build/ci-logs/*.log
          if-no-files-found: ignore
